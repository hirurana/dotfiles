# ---- Prefix: Ctrl+Space ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- General ----
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# Keep the editor/term/claude/lazygit names fixed
setw -g automatic-rename off
set -g allow-rename off

# ---- Project picker: Alt+f (ƒ covers iTerm's default Option behaviour) ----
bind -n M-f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-project"
bind -n ƒ   display-popup -E -w 60% -h 60% "~/.local/bin/tmux-project"

# ---- Cycle windows: Shift+Left / Shift+Right ----
bind -n S-Left  previous-window
bind -n S-Right next-window

# ---- Splits: prefix + | (side by side), prefix + - (stacked) ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Restore missing windows: prefix + R ----
bind R run-shell "~/.local/bin/tmux-project --restore"

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Status bar ----
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold,fg=green] #S  "
set -g status-left-length 40
set -g status-right "#[fg=brightblack]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold,fg=black,bg=green] #I:#W "
